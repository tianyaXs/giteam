name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            args: "--target aarch64-apple-darwin"
          # Intel 交叉编译先关掉：在 arm runner 上曾 40s 内失败，且日志不可见；需要时再单独加回
          # - name: macos-x86_64
          #   os: macos-14
          #   args: "--target x86_64-apple-darwin"
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY."
            echo "Add it under Settings → Secrets → Actions from: cat ~/.giteam/updater.key"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.name == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || matrix.name == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-release-${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          npm ci --no-fund --no-audit

      - name: Build frontend (typecheck + vite)
        working-directory: apps/desktop
        run: npm run build

      # 先单独构建并落盘日志，失败时把尾部打进 annotation（避免只能看到 npm exit 1）
      - name: Build Tauri app
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          EXTRA_ARGS="${{ matrix.args }}"
          # shellcheck disable=SC2086
          npx tauri build --config src-tauri/tauri.ci.conf.json ${EXTRA_ARGS} 2>&1 | tee tauri-build.log

      - name: Upload Tauri build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ matrix.name }}
          path: apps/desktop/tauri-build.log
          if-no-files-found: ignore

      - name: Annotate Tauri build failure
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ -f tauri-build.log ]; then
            echo "::group::tauri-build.log (tail)"
            tail -n 120 tauri-build.log
            echo "::endgroup::"
            ERR_LINE="$(grep -niE 'error(\[|:)|failed|panic' tauri-build.log | tail -n 8 || true)"
            if [ -n "$ERR_LINE" ]; then
              while IFS= read -r line; do
                echo "::error::${line}"
              done <<< "$ERR_LINE"
            else
              echo "::error::Tauri build failed; see artifact tauri-build-log-${{ matrix.name }}"
            fi
          fi

      - name: Publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: giteam ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseBody: |
            Desktop build for in-app updater.

            Installers and `latest.json` are attached for `tauri-plugin-updater`.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # 跳过 beforeBuildCommand；rust-cache 会加速 action 内的二次 build
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
