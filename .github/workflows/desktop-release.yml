name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*.*.*"

# 仓库 Settings → Actions → General → Workflow permissions 必须选
# “Read and write permissions”，否则创建 Release 会报：
# Resource not accessible by integration
permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            args: "--target aarch64-apple-darwin"
          # Intel 交叉编译先关掉
          # - name: macos-x86_64
          #   os: macos-14
          #   args: "--target x86_64-apple-darwin"
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # pi_agent_rust 仓库含极深测试路径；Windows MAX_PATH(260) 会在 cargo git checkout 时炸
      - name: Windows long path workaround
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo "CARGO_HOME=C:/c" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          powershell.exe -NoProfile -Command \
            "New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null"
          echo "Enabled Windows long paths; CARGO_HOME=C:/c"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY."
            echo "Add it under Settings → Secrets → Actions from: cat ~/.giteam/updater.key"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.name == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || matrix.name == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-release-${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          npm ci --no-fund --no-audit

      - name: Build frontend (typecheck + vite)
        working-directory: apps/desktop
        run: npm run build

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先用 PAT，避免仓库把 GITHUB_TOKEN 锁成只读
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: Giteam ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseBody: |
            ## Agent 与工具

            - 新增一等公民后台 Shell：`bash(run_in_background=true)`、`bash_output`、`kill_shell`
            - 前台禁止 `timeout: 0` 与超长超时；识别 `http.server` / `npm run dev` 等长驻命令并引导改后台
            - 禁止用 `&` / `nohup` / `setsid` 伪后台；会话结束自动回收后台进程
            - 修复「帮我启动」类任务因前台长驻服务导致会话卡住的问题

            ## 输入与对话体验

            - 进度卡片与内容区留出间距，并略收窄卡片宽度
            - 切换会话后自动聚焦输入框；新会话 / 继续跟进输入区更轻薄对齐
            - 多行跟进时附件、模型与发送按钮固定贴底
            - 全选对话时减少空白与附件被整块高亮
            - 进度卡片避开滚动条，消息流滚动条改为主题自适应浅色细条

            ## 设置与数据

            - 会话正文位于 `~/.giteam/pi-sessions/`（按仓库隔离）；应用数据统一落在 `~/.giteam`
            - 设置支持界面缩放、代码字号、自动更新开关；大版本更新后提供「What's New」向导
            - 侧栏支持置顶项目与悬停卡片

            ## 稳定性修复

            - Windows 发行版改为 GUI 子系统，打开应用不再附带会拖垮进程的 cmd 窗口
            - 启动不再强制全屏依赖安装页（Ubuntu 等平台不再卡在 0%）
            - 修复 Windows 构建中的同卷判断问题
            - 优化应用内更新下载安装（含跨卷临时目录）

            打开 **设置 → 关于** 即可安装，或在下方下载对应平台安装包。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # inline JSON，避免 tauri-action 把文件路径先当 JSON 解析
          args: ${{ matrix.args }} --config {"build":{"beforeBuildCommand":""}}
