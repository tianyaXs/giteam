name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*.*.*"

# 仓库 Settings → Actions → General → Workflow permissions 必须选
# “Read and write permissions”，否则创建 Release 会报：
# Resource not accessible by integration
permissions:
  contents: write

jobs:
  # 先单独创建/复用 Release，避免 matrix 多平台同时 create 撞 already_exists
  create-release:
    name: Create release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.ensure.outputs.result }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=desktop-v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure GitHub release
        id: ensure
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = process.env.TAG_NAME;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = `Giteam ${tag}`;
            const body = `## 本版重点（0.2.56）

            - 修复 macOS 正式包本地网络授权不能跨版本保持的问题
            - 正式包改用稳定的 Giteam Desktop 代码签名身份，不再使用每次构建漂移的 ad-hoc 签名
            - 安装新版本后首次访问局域网模型服务时授权一次，后续升级通常保持授权
            - 若系统仍拒绝，请在 系统设置 → 隐私与安全性 → 本地网络 中手动允许 Giteam

            ## 说明

            - 打开 **设置 → 关于** 即可安装，或在下方下载对应平台安装包
            - Windows 建议安装 Git for Windows
            - 详细说明见 \`docs/releases/desktop-v0.2.56.md\``;

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Reusing existing release ${release.data.id} for ${tag}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name,
                body,
                draft: false,
                prerelease: false,
              });
              core.info(`Created release ${release.data.id} for ${tag}`);
            }
            return String(release.data.id);

  publish:
    name: Build ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            args: "--target aarch64-apple-darwin"
          # Intel 交叉编译先关掉
          # - name: macos-x86_64
          #   os: macos-14
          #   args: "--target x86_64-apple-darwin"
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # pi_agent_rust 仓库含极深测试路径；Windows MAX_PATH(260) 会在 cargo git checkout 时炸
      - name: Windows long path workaround
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo "CARGO_HOME=C:/c" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          powershell.exe -NoProfile -Command \
            "New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null"
          echo "Enabled Windows long paths; CARGO_HOME=C:/c"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # package-lock 由 npm 10 生成；Node 22 自带 npm 可能是 10.x，显式钉住避免 ci 漂移
      - name: Pin npm 10
        run: npm install -g npm@10.9.8

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY."
            echo "Add it under Settings → Secrets → Actions from: cat ~/.giteam/updater.key"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.name == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || matrix.name == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-release-${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # GitHub-hosted Ubuntu images sometimes ship Microsoft apt sources that
          # return 403 Forbidden and break the whole `apt-get update`.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
            /etc/apt/sources.list.d/azure-cli*.list \
            /etc/apt/sources.list.d/msprod*.list || true
          sudo find /etc/apt/sources.list.d -type f -name '*.list' -print0 2>/dev/null \
            | xargs -0 -r grep -l 'packages.microsoft.com' \
            | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          npm ci --no-fund --no-audit

      - name: Build frontend (typecheck + vite)
        working-directory: apps/desktop
        env:
          # Packaged 「云端」default must be the public Gateway, not loopback.
          VITE_DEFAULT_CLOUD_BASE_URL: ${{ secrets.VITE_DEFAULT_CLOUD_BASE_URL || 'http://115.190.220.45:8787' }}
        run: npm run build

      # macOS 本地网络隐私按稳定代码签名身份记录授权。
      # ad-hoc/linker 签名每次构建 UUID 都会漂移，用户授权无法跨版本保持，
      # 会导致正式包访问局域网模型服务时被系统静默拒绝（EHOSTUNREACH/No route to host）。
      - name: Import stable macOS codesign identity
        if: matrix.name == 'macos-aarch64'
        shell: bash
        env:
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CODESIGN_P12" ] || [ -z "$MACOS_CODESIGN_PASSWORD" ]; then
            echo "::error::Missing macOS codesign secrets (MACOS_CODESIGN_P12 / MACOS_CODESIGN_PASSWORD)."
            exit 1
          fi
          KEYCHAIN=build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$MACOS_CODESIGN_P12" | base64 --decode > /tmp/giteam-codesign.p12
          # 使用 OpenSSL 传统 PKCS12 算法，避免 macOS security 不识别 AES PBES2。
          security import /tmp/giteam-codesign.p12 -k "$KEYCHAIN" -P "$MACOS_CODESIGN_PASSWORD" -T /usr/bin/codesign
          # 自签身份没有外部 CA 链，必须标记信任，否则 codesign 无法使用“valid identity”。
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN" /tmp/giteam-codesign.crt
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先用 PAT，避免仓库把 GITHUB_TOKEN 锁成只读
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DEFAULT_CLOUD_BASE_URL: ${{ secrets.VITE_DEFAULT_CLOUD_BASE_URL || 'http://115.190.220.45:8787' }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: Giteam ${{ needs.create-release.outputs.tag_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # inline JSON，避免 tauri-action 把文件路径先当 JSON 解析
          args: ${{ matrix.args }} --config '{"build":{"beforeBuildCommand":""}${{ matrix.name == 'macos-aarch64' && ', "bundle":{"macOS":{"signingIdentity":"Giteam Desktop"}}' || '' }}'}
