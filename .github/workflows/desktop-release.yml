name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*.*.*"

# 仓库 Settings → Actions → General → Workflow permissions 必须选
# “Read and write permissions”，否则创建 Release 会报：
# Resource not accessible by integration
permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            args: "--target aarch64-apple-darwin"
          # Intel 交叉编译先关掉
          # - name: macos-x86_64
          #   os: macos-14
          #   args: "--target x86_64-apple-darwin"
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # pi_agent_rust 仓库含极深测试路径；Windows MAX_PATH(260) 会在 cargo git checkout 时炸
      - name: Windows long path workaround
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo "CARGO_HOME=C:/c" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          powershell.exe -NoProfile -Command \
            "New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null"
          echo "Enabled Windows long paths; CARGO_HOME=C:/c"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY."
            echo "Add it under Settings → Secrets → Actions from: cat ~/.giteam/updater.key"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)."

      # 可选：仓库 Secrets 里建 GH_RELEASE_TOKEN（classic PAT, scope=repo）可绕过只读 GITHUB_TOKEN
      - name: Verify GitHub release permission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /tmp/gh-perm.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=1")"
          if [ "$CODE" != "200" ]; then
            echo "::error::Cannot list releases (HTTP ${CODE}). Check token."
            cat /tmp/gh-perm.json || true
            exit 1
          fi
          # 探测 create 权限：对不存在的 tag 发 dry 请求不现实，改用 repo 权限字段
          CODE="$(curl -sS -o /tmp/gh-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}")"
          PERM="$(python3 -c 'import json; print(json.load(open("/tmp/gh-repo.json")).get("permissions",{}).get("push", False))' 2>/dev/null || echo False)"
          echo "repo.push=${PERM} list_releases_http=${CODE}"
          if [ "$PERM" != "True" ] && [ "$PERM" != "true" ]; then
            echo "::error::Token cannot push/create releases (Resource not accessible by integration)."
            echo "Fix: https://github.com/${{ github.repository }}/settings/actions → Workflow permissions → Read and write permissions"
            echo "Or add secret GH_RELEASE_TOKEN = classic PAT with repo scope."
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.name == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || matrix.name == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-release-${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          npm ci --no-fund --no-audit

      - name: Build frontend (typecheck + vite)
        working-directory: apps/desktop
        run: npm run build

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先用 PAT，避免仓库把 GITHUB_TOKEN 锁成只读
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: giteam ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseBody: |
            Desktop build for in-app updater.

            Installers and `latest.json` are attached for `tauri-plugin-updater`.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # inline JSON，避免 tauri-action 把文件路径先当 JSON 解析
          args: ${{ matrix.args }} --config {"build":{"beforeBuildCommand":""}}
