name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*.*.*"

# 仓库 Settings → Actions → General → Workflow permissions 必须选
# “Read and write permissions”，否则创建 Release 会报：
# Resource not accessible by integration
permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            args: "--target aarch64-apple-darwin"
          # Intel 交叉编译先关掉
          # - name: macos-x86_64
          #   os: macos-14
          #   args: "--target x86_64-apple-darwin"
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # pi_agent_rust 仓库含极深测试路径；Windows MAX_PATH(260) 会在 cargo git checkout 时炸
      - name: Windows long path workaround
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo "CARGO_HOME=C:/c" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          powershell.exe -NoProfile -Command \
            "New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null"
          echo "Enabled Windows long paths; CARGO_HOME=C:/c"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY."
            echo "Add it under Settings → Secrets → Actions from: cat ~/.giteam/updater.key"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)."

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.name == 'linux-x86_64' && 'x86_64-unknown-linux-gnu' || matrix.name == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-release-${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # GitHub-hosted Ubuntu images sometimes ship Microsoft apt sources that
          # return 403 Forbidden and break the whole `apt-get update`.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list \
            /etc/apt/sources.list.d/azure-cli*.list \
            /etc/apt/sources.list.d/msprod*.list || true
          sudo find /etc/apt/sources.list.d -type f -name '*.list' -print0 2>/dev/null \
            | xargs -0 -r grep -l 'packages.microsoft.com' \
            | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          npm ci --no-fund --no-audit

      - name: Build frontend (typecheck + vite)
        working-directory: apps/desktop
        env:
          # Packaged 「云端」default must be the public Gateway, not loopback.
          VITE_DEFAULT_CLOUD_BASE_URL: ${{ secrets.VITE_DEFAULT_CLOUD_BASE_URL || 'http://115.190.220.45:8787' }}
        run: npm run build

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先用 PAT，避免仓库把 GITHUB_TOKEN 锁成只读
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DEFAULT_CLOUD_BASE_URL: ${{ secrets.VITE_DEFAULT_CLOUD_BASE_URL || 'http://115.190.220.45:8787' }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: Giteam ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseBody: |
            ## 自动化（新）

            - 左侧栏新增「自动化」入口，主界面可在 Agent / 自动化之间切换
            - 为已导入项目创建定时任务：到点由本机 Agent 静默执行目标 prompt（需保持 Giteam 运行）
            - 支持新会话 / 已有会话；目标会话 busy 时自动跳过并写入历史
            - 调度：每天 / 工作日 / 每周 / 间隔 / 自定义；可指定模型、推理强度、通知级别
            - 三栏 UI：任务列表 + 创建/详情表单（Codex 风格）+ 运行历史；支持立即运行、暂停、搜索过滤
            - 运行完成未读蓝点；打开详情后标记已读；桌面通知尊重「Agent 通知」总开关
            - 本地存储 `~/.giteam/automation.db`

            ## 项目分享（新）

            - 将项目快照（代码 + 会话 + 记忆 + 附件）导出上传云端，生成分享链接
            - 导出自动脱敏 API Key / Token / 私钥；代码（git bundle）与上下文分包上传
            - 项目右键「分享项目…」；弹窗展示链接、体积、会话数与 CLI 导入命令
            - 新增「添加项目」向导：本地文件夹导入，或凭分享链接远程导入
            - 支持 `giteam://import` 深链与冷启动 pending URL；可选 `--attach` 合并到已有仓库

            ## Agent 与会话

            - 会话结束后用 history 对账补全漏掉的最终回复，避免整表替换闪动
            - 过滤 Pi 自动压缩注入的 user 摘要块，UI 不再展示模型专用英文摘要
            - 停止响应更快：prompt 与 abort 竞速；支持按 session 中止活跃 run
            - abort 时 revert 未完成响应，避免残留半截 assistant 消息

            ## 桌面界面

            - 分支切换移至左侧 `BranchPickerNavItem`（搜索 / 切换 / 新建分支）
            - 资产图谱标签 LOD：拉近显示名称、聚焦时非相关节点淡化
            - 右侧栏 tab 轻量胶囊样式；设置「工作树」文案统一为「分支」

            ## 云端 Gateway（自托管）

            - Project Share API：分块上传、finalize、公开 clone 端点、管理员撤销
            - Cloud 管理后台 Shares 页；公开落地页展示体积、CLI 命令与深链

            ## CLI（需单独升级至 0.1.52）

            - `giteam share create / import / list / revoke`
            - `giteam init --from <url>` 与 `--attach` 远程/合并导入

            ## 说明

            打开 **设置 → 关于** 即可安装，或在下方下载对应平台安装包。
            Windows 建议安装 Git for Windows，终端体验更接近 macOS。
            使用项目分享或自动化前，请先将 Giteam 更新至本版本。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # inline JSON，避免 tauri-action 把文件路径先当 JSON 解析
          args: ${{ matrix.args }} --config {"build":{"beforeBuildCommand":""}}
