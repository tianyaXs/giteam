name: NPM Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'cli-v*.*.*'

permissions:
  contents: write

jobs:
  publish-platform:
    name: Publish ${{ matrix.platform.key }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - key: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - key: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - key: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # pi_agent_rust 仓库含极深测试路径；Windows MAX_PATH(260) 会在 cargo git checkout 时炸
      - name: Windows long path workaround
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo "CARGO_HOME=C:/c" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          powershell.exe -NoProfile -Command \
            "New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null"
          echo "Enabled Windows long paths; CARGO_HOME=C:/c"

      # 必须与仓库 rust-toolchain.toml 一致：若装到 stable 而目录覆盖到 nightly，
      # hasRustTarget / cargo 会看不到 matrix 里加过的 target（linux-x64 musl 曾因此失败）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-05
          targets: ${{ matrix.platform.rust_target }}
      - name: Ensure Rust target installed
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.platform.rust_target }}"
          rustup target list --installed | tee /tmp/rust-targets.txt
          grep -F "${{ matrix.platform.rust_target }}" /tmp/rust-targets.txt
      - name: Install musl tools
        if: matrix.platform.key == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish platform package
        working-directory: apps/cli
        run: node ./scripts/publish-packages.js --platform ${{ matrix.platform.key }} --no-root --no-auto-bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-root:
    name: Publish root package
    needs: publish-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-05
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install desktop dependencies only
        run: npm --prefix apps/desktop ci
      - name: Publish root package
        working-directory: apps/cli
        run: node ./scripts/publish-packages.js --root-only --skip-build --no-auto-bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release
    needs: publish-root
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Giteam CLI ${{ github.ref_name }}" \
            --notes "$(cat <<'EOF'
          ## 项目分享（新）

          - \`giteam share create\`：导出项目快照上传云端，输出分享地址、Git remote、代码/上下文体积
          - \`giteam share import\`：凭 URL 或 \`giteam://import\` 深链导入（等同 \`giteam init --from\`）
          - \`giteam share list\` / \`giteam share revoke\`：列出与撤销本工作区已发布分享
          - \`giteam init --from <url>\`：远程导入；支持 \`--attach\` 将上下文合并到已有仓库
          - JSON 输出含 \`gitUrl\`、\`repoSizeBytes\`、\`contextSizeBytes\`、\`contextSha256\`

          ## Core 与 Control

          - 新增 \`giteam-core/share\`：export / import / pack / redact / client 完整分享链路
          - 导出自动脱敏敏感信息；代码 bundle 与上下文分包
          - Control API \`/api/v1/agent/abort\` 支持 \`sessionId\` 作为 \`runId\` 替代参数

          ## 安装

          \`\`\`bash
          npm install -g giteam@0.1.53
          \`\`\`

          桌面端请同步升级至 **desktop-v0.2.45** 以使用分享 UI 与自动化模块。
          EOF
          )"
