[package]
name = "giteam-core"
version = "0.1.33"
edition = "2021"

[features]
default = []
tauri-app = ["dep:tauri"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
pi = { package = "pi_agent_rust", git = "https://github.com/Dicklesworthstone/pi_agent_rust", rev = "b27abd576cc0d2f39e2eef8f87f7897edec53b4f", default-features = false }
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
thiserror = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
which = "6"

[target."cfg(unix)".dependencies]
libc = "0.2"
