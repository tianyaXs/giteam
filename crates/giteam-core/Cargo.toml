[package]
name = "giteam-core"
version = "0.1.36"
edition = "2021"

[features]
default = []
tauri-app = ["dep:tauri"]

[dependencies]
# pi AgentSession.session 的锁入口（run 中周期 flush_autosave，见 service.rs）。
asupersync = { version = "0.3.9", default-features = false }
async-trait = "0.1"
base64 = "0.22"
calamine = "0.37"
docx-rs = { version = "0.4", default-features = false }
futures = "0.3"
# fork 修复：openai 兼容流式 chunk 容忍显式 "choices": null / "delta": null
# （indemind/glm-5.3-flash 间歇发送，serde default 只兜缺失不兜 null，
# 上游解析即炸致 run 中断——见 ui-debug 2026-11-13 四次 JSON parse error）。
pi = { package = "pi_agent_rust", git = "https://github.com/tianyaXs/pi_agent_rust", rev = "903aed589896f16153c40c7a7655f7978f36070c", default-features = false }
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", default-features = false, features = ["time", "macros", "rt", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
which = "6"
html2text = "0.17.1"
mcpstore = { version = "2.2.1", default-features = false, features = ["light"] }
tar = "0.4"
zstd = "0.13"
regex = "1"
rust_xlsxwriter = "0.101"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }

[patch.crates-io]
# Windows HTTPS 出站修复（asupersync#35），见 apps/desktop/src-tauri/Cargo.toml 注释。
asupersync = { git = "https://github.com/tianyaXs/asupersync-1", branch = "fix/windows-connect-completion-v0.3.9" }
