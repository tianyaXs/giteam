[package]
name = "giteam-core"
version = "0.1.36"
edition = "2021"

[features]
default = []
tauri-app = ["dep:tauri"]

[dependencies]
# 与 pi_agent_rust 0.8 同版；勿再 patch 成无关旧 fork，否则双版本类型打架。
asupersync = { version = "0.5.0", default-features = false }
async-trait = "0.1"
base64 = "0.22"
calamine = "0.37"
docx-rs = { version = "0.4", default-features = false }
futures = "0.3"
# 基于上游 b217af5 + Windows win_job feature gate 补丁（#257 未合前）；
# sqlite-sessions 为 session_index 硬依赖。
pi = { package = "pi_agent_rust", git = "https://github.com/tianyaXs/pi_agent_rust", rev = "9daf269d0eaa2ebacdada5f84ee0d0d668f841fd", default-features = false, features = ["sqlite-sessions"] }
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "macros", "rt", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
which = "6"
html2text = "0.17.1"
mcpstore = { version = "2.2.1", default-features = false, features = ["light"] }
tar = "0.4"
zstd = "0.13"
regex = "1"
rust_xlsxwriter = "0.101"
tempfile = "3"
# 与 pi_agent_rust(=9.0.5) 对齐
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
