services:
  init-permissions:
    build:
      context: .
      dockerfile: Dockerfile
    image: giteam/remote-repo-service:local
    user: "0:0"
    volumes:
      - "${REMOTE_REPO_CONFIG_DIR:-./deploy/config}:/etc/giteam"
      - "${REMOTE_REPO_DATA_DIR:-./deploy/data}:/var/lib/giteam/remote-repo-service"
    command: ["sh", "-ec", "mkdir -p /etc/giteam /var/lib/giteam/remote-repo-service && chown -R giteam:giteam /etc/giteam /var/lib/giteam/remote-repo-service || echo 'Warning: could not chown bind mounts; continuing'"]

  remote-repo-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: giteam/remote-repo-service:local
    container_name: giteam-remote-repo-service
    restart: unless-stopped
    user: "${REMOTE_REPO_SERVICE_USER:-10001:10001}"
    environment:
      REMOTE_REPO_SERVICE_CONFIG: /etc/giteam/remote-repo-service.json
      REMOTE_REPO_SERVICE_API_KEY: ${REMOTE_REPO_SERVICE_API_KEY:?Set REMOTE_REPO_SERVICE_API_KEY before starting the service}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    ports:
      # Loopback is the safe default. For a trusted LAN, set
      # REMOTE_REPO_BIND_ADDRESS=0.0.0.0 in the shell or a .env file.
      - "${REMOTE_REPO_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    volumes:
      # Mount directories (not a single JSON file): service-side CRUD writes
      # the config atomically and state must survive image recreation.
      - "${REMOTE_REPO_CONFIG_DIR:-./deploy/config}:/etc/giteam"
      - "${REMOTE_REPO_DATA_DIR:-./deploy/data}:/var/lib/giteam/remote-repo-service"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
