[package]
name = "giteam-desktop"
version = "0.2.3"
edition = "2021"

# tauri dev 不走 .app bundle，macOS 菜单栏会显示二进制名；与 productName 对齐。
[[bin]]
name = "Giteam"
path = "src/main.rs"

[features]
default = ["tauri-app"]
tauri-app = []

[dependencies]
giteam-core = { path = "../../../crates/giteam-core", features = ["tauri-app"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.39", features = ["bundled"] }
wait-timeout = "0.2"
rfd = "0.14"
urlencoding = "2"
base64 = "0.22"
notify = "6.1"
fastrand = "2"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["std", "NSButton", "NSControl", "NSEvent", "NSMenu", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "objc2-core-foundation"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
