[package]
name = "giteam-desktop"
version = "0.2.42"
edition = "2021"

# tauri dev 不走 .app bundle，macOS 菜单栏会显示二进制名；与 productName 对齐。
[[bin]]
name = "Giteam"
path = "src/main.rs"

[features]
default = ["tauri-app"]
tauri-app = []

[dependencies]
giteam-core = { path = "../../../crates/giteam-core", features = ["tauri-app"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-window-state = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
wait-timeout = "0.2"
rfd = "0.14"
urlencoding = "2"
url = "2"
base64 = "0.22"
notify = "6.1"
fastrand = "2"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
# tokio features：browser_use requestId RPC（sync/time）+ chromiumoxide 启动 Chrome 子进程（process）、
# WebSocket（net）、handler task 轮询（rt/spawn）；tauri 已传递依赖，显式声明不增编译。
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "process"] }
# chromiumoxide 的 Handler 实现 Stream，轮询 next() 需 futures::StreamExt。
futures = "0.3"
# 内置浏览器后端：CDP（Chrome DevTools Protocol）客户端，agent 经标准 WebSocket 操作真实 Chrome，
# 绕开 Tauri 外部 URL 子 webview 的 IPC 断链（postMessage/invoke/fetch custom scheme 均不可达 Rust）。
# 0.9 已默认绑 tokio（无 tokio-runtime feature）；default 不含 fetcher，用系统 Chrome 不下载。
chromiumoxide = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["std", "NSButton", "NSControl", "NSEvent", "NSMenu", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "objc2-core-foundation"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
# Windows HTTPS 出站修复（asupersync#35）：asupersync 非阻塞 connect() 在 Windows
# 上 peer_addr() 假成功，把仍 pending 的 socket 交给 TLS 致首个 send 命中
# WSAENOTCONN (os error 10057)。fork 改为等 reactor writable 就绪 + SO_ERROR
# 确认连接真正完成后再交出 socket。详见 https://github.com/tianyaXs/asupersync-1
# 分支 fix/windows-connect-completion-v0.3.9。
asupersync = { git = "https://github.com/tianyaXs/asupersync-1", branch = "fix/windows-connect-completion-v0.3.9" }
