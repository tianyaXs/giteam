<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <script>
      (() => {
        const theme = localStorage.getItem("giteam.theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.background = theme === "light" ? "#ffffff" : "#1e1e1e";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#1e1e1e");
      })();
    </script>
    <style>
      /* 启动屏：纯 CSS 实现，transform 动画由合成器线程驱动——
         启动期 JS 主线程繁忙（bundle 执行 + 首屏渲染）时动画依然流畅。
         React 数据就绪后加 .app-splash-exit 淡出并移除节点。 */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme="light"] #app-splash { background: #ffffff; }
      #app-splash.app-splash-exit { opacity: 0; }
      #app-splash img {
        width: 64px;
        height: 64px;
        /* 透明底的黑色 logo 本体：drop-shadow 跟随 alpha 轮廓，旋转时与图形同步 */
        filter: drop-shadow(0 0 14px rgba(0, 0, 0, 0.16));
        animation: app-splash-spin 2.4s linear infinite;
      }
      /* 深色主题：黑色本体反转为白，配白色光晕，避免深底色上不可见 */
      html[data-theme="dark"] #app-splash img {
        filter: invert(1) drop-shadow(0 0 14px rgba(255, 255, 255, 0.22));
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img { animation: none; }
      }
    </style>
    <title>Giteam</title>
  </head>
