<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <script>
      (() => {
        const theme = localStorage.getItem("giteam.theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.background = theme === "light" ? "#ffffff" : "#1e1e1e";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#1e1e1e");
      })();
    </script>
    <style>
      /* 启动屏：仅雾面 + logo 旋转（合成器动画，不占主线程）。 */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(22, 22, 24, 0.48);
        -webkit-backdrop-filter: blur(26px) saturate(1.08);
        backdrop-filter: blur(26px) saturate(1.08);
        transition:
          opacity 360ms cubic-bezier(0.22, 1, 0.36, 1),
          backdrop-filter 280ms ease,
          -webkit-backdrop-filter 280ms ease;
      }
      html[data-theme="light"] #app-splash {
        background: rgba(248, 248, 250, 0.52);
      }
      #app-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.55;
        background:
          radial-gradient(ellipse 42% 36% at 18% 22%, rgba(255, 255, 255, 0.05), transparent 72%),
          radial-gradient(ellipse 38% 48% at 84% 68%, rgba(255, 255, 255, 0.035), transparent 70%),
          radial-gradient(ellipse 50% 40% at 62% 18%, rgba(0, 0, 0, 0.06), transparent 75%),
          radial-gradient(ellipse 46% 34% at 28% 78%, rgba(0, 0, 0, 0.05), transparent 74%);
      }
      html[data-theme="light"] #app-splash::before {
        opacity: 0.45;
        background:
          radial-gradient(ellipse 42% 36% at 18% 22%, rgba(255, 255, 255, 0.18), transparent 72%),
          radial-gradient(ellipse 38% 48% at 84% 68%, rgba(255, 255, 255, 0.12), transparent 70%),
          radial-gradient(ellipse 50% 40% at 62% 18%, rgba(24, 24, 28, 0.04), transparent 75%),
          radial-gradient(ellipse 46% 34% at 28% 78%, rgba(24, 24, 28, 0.035), transparent 74%);
      }
      #app-splash.app-splash-exit {
        opacity: 0;
        pointer-events: none;
        -webkit-backdrop-filter: blur(10px) saturate(1);
        backdrop-filter: blur(10px) saturate(1);
      }
      #app-splash img {
        position: relative;
        z-index: 3;
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 0 14px rgba(0, 0, 0, 0.16));
        animation: app-splash-spin 2.4s linear infinite;
      }
      html[data-theme="dark"] #app-splash img {
        filter: invert(1) drop-shadow(0 0 14px rgba(255, 255, 255, 0.22));
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img { animation: none; }
        #app-splash {
          -webkit-backdrop-filter: blur(16px);
          backdrop-filter: blur(16px);
        }
      }
    </style>
    <title>Giteam</title>
  </head>
