[package]
name = "giteam-cli"
version = "0.1.44"
edition = "2021"

[[bin]]
name = "giteam"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
giteam-core = { path = "../../crates/giteam-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# Windows HTTPS 出站修复（asupersync#35），见 apps/desktop/src-tauri/Cargo.toml 注释。
asupersync = { git = "https://github.com/tianyaXs/asupersync-1", branch = "fix/windows-connect-completion-v0.3.9" }
