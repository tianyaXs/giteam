# Optional Ingress — replace host for your cluster (do not commit production hosts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: giteam-cloud
  labels:
    app: giteam-cloud
spec:
  ingressClassName: nginx
  rules:
    - host: cloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: giteam-cloud
                port:
                  number: 8787
