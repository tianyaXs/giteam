apiVersion: apps/v1
kind: Deployment
metadata:
  name: giteam-cloud
  labels:
    app: giteam-cloud
spec:
  # Tunnel Hub is in-process memory — Phase 1 must stay single replica
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: giteam-cloud
  template:
    metadata:
      labels:
        app: giteam-cloud
    spec:
      # Optional: set imagePullSecrets via apply.sh PULL_SECRET_NAME
      containers:
        - name: giteam-cloud
          # apply.sh always sets the real private registry image
          image: giteam-cloud:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          envFrom:
            - configMapRef:
                name: giteam-cloud-config
            - secretRef:
                name: giteam-cloud-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: giteam-cloud
  labels:
    app: giteam-cloud
spec:
  type: ClusterIP
  selector:
    app: giteam-cloud
  ports:
    - name: http
      port: 8787
      targetPort: http
      protocol: TCP
