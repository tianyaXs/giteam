# Example only — real secrets come from deploy/local.env via apply.sh
# (kubectl create secret generic ... --from-literal=...)
apiVersion: v1
kind: Secret
metadata:
  name: giteam-cloud-secret
  labels:
    app: giteam-cloud
type: Opaque
stringData:
  JWT_SECRET: "change-me-jwt-secret-at-least-16-chars"
  ADMIN_TOKEN: "change-me-admin-token"
  DATABASE_URL: "postgres://giteam:giteam@giteam-cloud-postgres:5432/giteam_cloud"
